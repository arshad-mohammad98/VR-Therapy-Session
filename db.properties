# ==============================================================================
# Database Configuration for Virtual Reality Therapy Platform (Raw JDBC)
# ==============================================================================

# Mode: 'mysql' for native MySQL 8.x database server, or 'embedded' for zero-setup H2 (MySQL Mode)
db.mode=embedded

# MySQL 8 Configuration
db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/vrtherapy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.mysql.user=root
db.mysql.password=root

# Embedded Zero-Setup Configuration (H2 in MySQL Compatibility Mode)
db.embedded.driver=org.h2.Driver
db.embedded.url=jdbc:h2:file:./data/vrtherapy_jdbc_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
db.embedded.user=sa
db.embedded.password=

# Connection Pool Parameters (Managed by thread-safe custom ConnectionManager)
pool.initialSize=5
pool.maxSize=20
pool.connectionTimeoutMs=5000
