# Application & Server Configuration for VR Therapy Sessions Platform

# HTTP & HTTPS Port Settings
server.http.port=8080
server.https.port=8443
server.https.enabled=true

# PKCS12 SSL / TLS Keystore Settings for WebXR Sensor Access
server.keystore.file=vrtherapy.p12
server.keystore.password=vrtherapy123
server.keystore.type=PKCS12
server.keystore.alias=vrtherapy

# Automatic HTTPS Redirection for WebXR and Sensor-Dependent Routes
# When enabled, HTTP requests to WebXR routes are automatically redirected to HTTPS:8443
security.https.redirect.enabled=true
security.https.redirect.paths=/vr/,/simulator,/patient/device-pairing
